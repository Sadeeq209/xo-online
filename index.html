<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X and O</title>
<style>
:root{--bg:#faf8f3;--fg:#1d1c19;--card:#fff;--line:#d8d4c8;--x:#d9480f;--o:#1971c2;--mut:#77736a}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--fg:#f1efe8;--card:#22221f;--line:#3a3934;--x:#ff8a5c;--o:#74b4ff;--mut:#9a968b}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
h1{margin:0}
button{font:inherit;font-weight:600;border-radius:12px;border:1px solid var(--line);padding:12px 16px;background:var(--card);color:var(--fg);cursor:pointer}
button.main{background:var(--fg);color:var(--bg);border:0}
#status{font-size:1.15rem;font-weight:600;text-align:center}
#score{font-weight:700;font-size:1.05rem;text-align:center}
#sub{color:var(--mut);font-size:.9rem;text-align:center}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:340px}
.c{aspect-ratio:1;font-size:clamp(2.4rem,14vw,4rem);font-weight:800;padding:0}
.c.X{color:var(--x)}.c.O{color:var(--o)}.c.w{outline:3px solid var(--fg)}
</style></head><body>
<h1>X and O</h1>
<div id="status">Connecting…</div>
<div id="sub"></div>
<div id="score"></div>
<div id="board"></div>
<div style="display:flex;gap:8px"><button class="main" id="again">New game</button><button id="share">Copy invite link</button></div>
<script>
const $=id=>document.getElementById(id);
let code=new URLSearchParams(location.search).get('room');
if(!code){code=Math.random().toString(36).slice(2,6).toUpperCase();history.replaceState(null,'','?room='+code)}
code=code.toUpperCase();
let st=null,ws;
const cells=[];
for(let i=0;i<9;i++){const b=document.createElement('button');b.className='c';b.onclick=()=>ws&&ws.readyState===1&&ws.send(JSON.stringify({type:'move',i}));$('board').appendChild(b);cells.push(b)}
$('again').onclick=()=>ws.send(JSON.stringify({type:'reset'}));
$('share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('share').textContent='Copied!'}catch(e){prompt('Copy this link:',location.href)}setTimeout(()=>$('share').textContent='Copy invite link',1500)};
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>ws.send(JSON.stringify({type:'join',code}));
  ws.onmessage=e=>{st=JSON.parse(e.data);render()};
  ws.onclose=()=>{$('status').textContent='Disconnected. Reconnecting…';setTimeout(connect,1500)};
}
function render(){
  cells.forEach((c,i)=>{c.textContent=st.board[i];c.className='c '+st.board[i]+(st.line.includes(i)?' w':'')});
  const nameOf=m=>m==='X'?st.xName:st.oName;
  let s;
  if(st.winner==='draw')s="It's a draw";
  else if(st.winner)s=st.winner===st.role?'You win! 🎉':nameOf(st.winner)+' wins!';
  else if(!st.ready)s='Waiting for '+(st.me==='Maryam'?'Abubakar':'Maryam')+'…';
  else if(!st.role)s='Watching: '+nameOf(st.turn)+"'s turn";
  else s=st.turn===st.role?'Your turn':'Waiting for '+nameOf(st.turn)+'…';
  $('status').textContent=s;
  $('score').textContent='Abubakar '+st.scores.A+' – '+st.scores.M+' Maryam'+(st.scores.draws?' · Draws '+st.scores.draws:'');
  $('sub').textContent=st.role?('You are '+st.me+' ('+st.role+')'+(st.ready?' · '+st.xName+' = X, '+st.oName+' = O':'')):'Spectating';
}
connect();
</script></body></html>
