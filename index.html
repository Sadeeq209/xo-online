<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X and O</title>
<style>
:root{--bg:#faf8f3;--fg:#1d1c19;--card:#fff;--line:#d8d4c8;--x:#d9480f;--o:#1971c2;--mut:#77736a}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--fg:#f1efe8;--card:#22221f;--line:#3a3934;--x:#ff8a5c;--o:#74b4ff;--mut:#9a968b}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
h1{margin:0}
button{font:inherit;font-weight:600;border-radius:12px;border:1px solid var(--line);padding:12px 16px;background:var(--card);color:var(--fg);cursor:pointer}
button.main{background:var(--fg);color:var(--bg);border:0}
#status{font-size:1.15rem;font-weight:600;text-align:center}
#score{font-weight:700;font-size:1.05rem;text-align:center}
#sub{color:var(--mut);font-size:.9rem;text-align:center}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:340px}
.c{aspect-ratio:1;font-size:clamp(2.4rem,14vw,4rem);font-weight:800;padding:0}
.c.X{color:var(--x)}.c.O{color:var(--o)}.c.w{outline:3px solid var(--fg)}
#chat{width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px}
#msgs{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;height:150px;overflow-y:auto;font-size:.95rem}
.m{margin:0 0 6px}.m b{color:var(--mut)}
#row{display:flex;gap:8px}
#msg{flex:1;min-width:0;font:inherit;border-radius:12px;border:1px solid var(--line);padding:12px;background:var(--card);color:var(--fg)}
#react{display:flex;gap:8px}#react button{font-size:1.5rem;padding:6px 14px}
.fl{position:fixed;bottom:22%;font-size:2.4rem;pointer-events:none;animation:up 2s ease-out forwards;z-index:8;text-align:center}
.fl small{display:block;font-size:.7rem;color:var(--mut)}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-230px);opacity:0}}
</style></head><body>
<h1>X and O</h1>
<div id="status">Connecting…</div>
<div id="sub"></div>
<div id="score"></div>
<div id="board"></div>
<div style="display:flex;gap:8px"><button class="main" id="again">New game</button><button id="share">Copy invite link</button></div>
<div id="react"></div>
<div id="chat"><div id="msgs"></div><div id="row"><input id="msg" maxlength="200" placeholder="Type a message…"><button class="main" id="send">Send</button></div></div>
<script>
const $=id=>document.getElementById(id);
let code=new URLSearchParams(location.search).get('room');
if(!code){code=Math.random().toString(36).slice(2,6).toUpperCase();history.replaceState(null,'','?room='+code)}
code=code.toUpperCase();
let st=null,ws;
const cells=[];
for(let i=0;i<9;i++){const b=document.createElement('button');b.className='c';b.onclick=()=>ws&&ws.readyState===1&&ws.send(JSON.stringify({type:'move',i}));$('board').appendChild(b);cells.push(b)}
$('again').onclick=()=>ws.send(JSON.stringify({type:'reset'}));
$('share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('share').textContent='Copied!'}catch(e){prompt('Copy this link:',location.href)}setTimeout(()=>$('share').textContent='Copy invite link',1500)};
let ac;
document.addEventListener('click',()=>{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()});
function cheer(){
  if(!ac)return;
  [523,659,784,1047,784,1047].forEach((f,i)=>{
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*0.14;
    o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.3,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.35);
  });
}
function sendMsg(){const t=$('msg').value.trim();if(!t||!ws||ws.readyState!==1)return;ws.send(JSON.stringify({type:'chat',text:t}));$('msg').value=''}
$('send').onclick=sendMsg;
$('msg').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
let winMsg='';
const wname=m=>m==='X'?st.xName:st.oName;
function pickMsg(){
  const w=st.winner,pick=a=>a[Math.random()*a.length|0];
  if(w==='draw')return "It's a draw 🤝";
  if(w===st.role)return pick(['You win! 🎉',"You're cooking 🔥",'Too easy 😎','Champion! 👑']);
  const n=wname(w);
  return pick([n+' got you 😅',n+' is cooking 🔥',n+' wins! Rematch? 👀']);
}
function pop(){
  if(!ac)return;
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type='sine';o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(300,t+0.08);
  g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.1);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.12);
}
function confetti(){
  const cv=document.createElement('canvas');
  cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9';
  document.body.appendChild(cv);
  const w=cv.width=innerWidth,h=cv.height=innerHeight,x=cv.getContext('2d');
  const cols=['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93'];
  const ps=Array.from({length:140},()=>({x:Math.random()*w,y:-20-Math.random()*h*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*5|0]}));
  let t=0;
  (function f(){
    x.clearRect(0,0,w,h);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(++t<200)requestAnimationFrame(f);else cv.remove();
  })();
}
function floatEmoji(em,from){
  const d=document.createElement('div');d.className='fl';
  d.style.left=(15+Math.random()*60)+'%';
  d.textContent=em;const n=document.createElement('small');n.textContent=from;d.appendChild(n);
  document.body.appendChild(d);setTimeout(()=>d.remove(),2100);
}
['😂','❤️','👏','😮'].forEach(em=>{
  const b=document.createElement('button');b.textContent=em;
  b.onclick=()=>ws&&ws.readyState===1&&ws.send(JSON.stringify({type:'react',emoji:em}));
  $('react').appendChild(b);
});
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>ws.send(JSON.stringify({type:'join',code}));
  ws.onmessage=e=>{
    const d=JSON.parse(e.data);
    if(d.event==='react'){floatEmoji(d.emoji,d.from);return}
    const prev=st;st=d;
    const justWon=st.winner&&!(prev&&prev.winner);
    const moved=prev&&st.board.filter(Boolean).length>prev.board.filter(Boolean).length;
    if(!st.winner)winMsg='';
    if(justWon)winMsg=pickMsg();
    if(justWon&&st.winner!=='draw'&&st.winner===st.role){cheer();confetti()}
    else if(moved)pop();
    render();
  };
  ws.onclose=()=>{$('status').textContent='Disconnected. Reconnecting…';setTimeout(connect,1500)};
}
function render(){
  cells.forEach((c,i)=>{c.textContent=st.board[i];c.className='c '+st.board[i]+(st.line.includes(i)?' w':'')});
  const nameOf=m=>m==='X'?st.xName:st.oName;
  let s;
  if(st.winner==='draw')s="It's a draw";
  else if(st.winner)s=winMsg||(st.winner===st.role?'You win! 🎉':nameOf(st.winner)+' wins!');
  else if(!st.ready)s='Waiting for '+(st.me==='Maryam'?'Abubakar':'Maryam')+'…';
  else if(!st.role)s='Watching: '+nameOf(st.turn)+"'s turn";
  else s=st.turn===st.role?'Your turn':'Waiting for '+nameOf(st.turn)+'…';
  $('status').textContent=s;
  $('score').textContent=(st.streak.A>=3?'🔥 ':'')+'Abubakar '+st.scores.A+' – '+st.scores.M+' Maryam'+(st.streak.M>=3?' 🔥':'')+(st.scores.draws?' · Draws '+st.scores.draws:'');
  const box=$('msgs');box.textContent='';
  (st.chat||[]).forEach(c=>{const p=document.createElement('p');p.className='m';const b=document.createElement('b');b.textContent=c.name+': ';p.appendChild(b);p.appendChild(document.createTextNode(c.text));box.appendChild(p)});
  box.scrollTop=box.scrollHeight;
  $('sub').textContent=st.role?('You are '+st.me+' ('+st.role+')'+(st.ready?' · '+st.xName+' = X, '+st.oName+' = O':'')):'Spectating';
}
connect();
</script></body></html>
