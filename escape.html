<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escape Together</title>
<style>
:root{--bg:#14121f;--fg:#f3f0ff;--card:#221f33;--line:#3a3552;--acc:#ffb703;--mut:#a79fc4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding:56px 14px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center}
h1,h2{margin:0 0 8px;text-align:center}
p{margin:6px 0;text-align:center;color:var(--mut)}
button{font:inherit;font-weight:600;border-radius:12px;border:1px solid var(--line);padding:12px 16px;background:var(--card);color:var(--fg);cursor:pointer}
button.main{background:var(--acc);color:#1a1200;border:0}
button:disabled{opacity:.4}
.hide{display:none!important}
.scr{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:6vh}
#play{margin-top:0}
#badge{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top,0px));background:var(--acc);color:#1a1200;font-weight:800;padding:6px 12px;border-radius:999px;z-index:5}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
#grid button{padding:14px 8px}
.stage{position:relative;width:min(100%,calc(56vh*.6667));aspect-ratio:2/3;border-radius:16px;overflow:hidden;background:#222 center/cover no-repeat;border:1px solid var(--line)}
.ico{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:7rem;opacity:.18}
.hs{position:absolute;border:0;background:transparent;padding:0;border-radius:12px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.9rem}
.hs.fb{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35)}
.hs small{font-size:.58rem;font-weight:600;margin-top:2px}
.hs i{position:absolute;right:6px;top:6px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 10px 4px rgba(255,255,160,.8);animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.25;transform:scale(.7)}}
.debug .hs{outline:2px dashed red}
#lock{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
#lock .r{display:flex;gap:8px}
#lock input,#msg{flex:1;min-width:0;font:inherit;border-radius:12px;border:1px solid var(--line);padding:12px;background:var(--bg);color:var(--fg)}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#chat{width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px}
#msgs{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;height:140px;overflow-y:auto;font-size:.95rem;text-align:left}
.m{margin:0 0 6px;text-align:left;color:var(--fg)}.m b{color:var(--acc)}
.bar{width:70%;height:8px;background:var(--card);border-radius:8px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--acc);animation:ld 3.6s linear forwards}
@keyframes ld{from{width:0}to{width:100%}}
#lnum{font-size:2.6rem;font-weight:800;color:var(--acc)}
#limg{width:min(70%,260px);aspect-ratio:2/3;border-radius:16px;background:#222 center/cover;display:flex;align-items:center;justify-content:center;font-size:5rem}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px}
.box .big{font-size:3rem}.box p{color:var(--fg)}
</style></head><body>
<span id="badge" class="hide"></span>

<section id="welcome" class="scr"><h1>Welcome to Escape Together</h1><p id="wmsg"></p>
<button id="startBtn" class="main hide">Start the game</button><button id="linkBtn" class="hide">Copy Maryam’s invite link</button></section>

<section id="menu" class="scr hide"><h2>Pick a mission</h2><p id="mmsg"></p><div id="grid"></div></section>

<section id="loading" class="scr hide"><div id="lnum"></div><h2 id="ltitle"></h2><div id="limg"></div><p id="ltext"></p><div class="bar"><span></span></div></section>

<section id="play" class="scr hide"><h2 id="ptitle"></h2><div id="stage" class="stage"></div><div id="lock"></div>
<div id="ctl" style="display:flex;gap:8px"></div>
<div id="chat"><div id="msgs"></div><div style="display:flex;gap:8px"><input id="msg" maxlength="200" placeholder="Tell each other what you see…" style="flex:1;min-width:0;font:inherit;border-radius:12px;border:1px solid var(--line);padding:12px;background:var(--card);color:var(--fg)"><button class="main" id="send">Send</button></div></div></section>

<section id="full" class="scr hide"><h2>This game is full</h2><p>Ask for a fresh link.</p></section>

<div id="modal" class="ov hide"><div class="box" id="mbox"></div></div>
<div id="passed" class="ov hide"><div class="box"><div class="big">🎉</div><h1 id="ptxt">Mission passed!</h1><p>Great teamwork!</p></div></div>

<script>
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
let code=(params.get('room')||'').toUpperCase();
if(!code){code=Math.random().toString(36).slice(2,6).toUpperCase();params.set('room',code);history.replaceState(null,'','?'+params.toString())}
const as=params.get('as')==='maryam'?'maryam':'abubakar';
const TEST=params.has('test');
if(params.has('debug'))document.body.classList.add('debug');
let st=null,ws,ac,imgs={},lockKey='',stageKey='';

// sounds
document.addEventListener('click',()=>{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()});
function tone(f,t0,d,type,v){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||.3,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.05)}
function cheer(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.14,.3))}
function ding(){tone(880,0,.25,'sine');tone(1175,.12,.3,'sine')}
function pop(){tone(420,0,.1,'sine',.2)}
function confetti(){
  const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30';document.body.appendChild(cv);
  const w=cv.width=innerWidth,h=cv.height=innerHeight,x=cv.getContext('2d'),cols=['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93'];
  const ps=Array.from({length:150},()=>({x:Math.random()*w,y:-20-Math.random()*h*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*5|0]}));
  let t=0;(function f(){x.clearRect(0,0,w,h);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++t<220)requestAnimationFrame(f);else cv.remove()})();
}

// photos: /mission1.jpg etc. (jpg, jpeg, png or webp)
function findImg(n){
  if(imgs[n]!==undefined)return Promise.resolve(imgs[n]);
  const ex=['jpg','jpeg','png','webp'];
  return new Promise(res=>{let i=0;(function next(){
    if(i>=ex.length){imgs[n]=null;return res(null)}
    const u='/mission'+n+'.'+ex[i++],im=new Image();
    im.onload=()=>{imgs[n]=u;res(u)};im.onerror=next;im.src=u;
  })()});
}
function el(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}

function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/escape-ws');
  ws.onopen=()=>{let u=[];try{u=JSON.parse(localStorage.getItem('escape_unlocked')||'[]')}catch(e){}send({type:'join',code,as,unlocked:u})};
  ws.onmessage=e=>{
    const d=JSON.parse(e.data);
    if(d.event==='wrong'){const l=$('lock');l.classList.remove('shake');void l.offsetWidth;l.classList.add('shake');const n=$('lockmsg');if(n)n.textContent='Not quite. Talk it over and try again.';return}
    const old=st;st=d;
    if(st.phase==='passed'&&(!old||old.phase!=='passed')){cheer();confetti()}
    else if(old&&st.phase==='play'&&old.phase==='play'&&st.mission&&old.mission&&st.mission.id===old.mission.id&&st.step>old.step)ding();
    if(st.role==='A'){try{localStorage.setItem('escape_unlocked',JSON.stringify(st.unlocked))}catch(e){}}
    render();
  };
  ws.onclose=()=>{setTimeout(connect,1500)};
}
setInterval(()=>send({type:'ping'}),25000);

function showModal(h,other){
  const b=$('mbox');b.textContent='';
  b.appendChild(el('div',h.e,'big'));b.appendChild(el('h2',h.label));
  b.appendChild(el('p',h.text||('Nothing useful here for you. Maybe '+other+' sees something?')));
  const c=el('button','Close','main');c.onclick=()=>$('modal').classList.add('hide');b.appendChild(c);
  $('modal').classList.remove('hide');pop();
}

function render(){
  if(!st)return;
  const p=st.full?'full':st.phase==='loading'?'loading':(st.phase==='play'||st.phase==='passed')?'play':st.phase;
  ['welcome','menu','loading','play','full'].forEach(s=>$(s).classList.toggle('hide',s!==p));
  const m=st.mission,isA=st.role==='A',other=isA?'Maryam':'Abubakar';
  if(m&&imgs[m.id]===undefined)findImg(m.id).then(render);
  $('badge').classList.toggle('hide',!(m&&(p==='loading'||p==='play')));
  if(m)$('badge').textContent='Mission '+m.id;
  $('passed').classList.toggle('hide',st.phase!=='passed');
  if(m)$('ptxt').textContent=m.id===0?'Test complete!':'Mission passed!';

  if(p==='welcome'){
    $('wmsg').textContent=isA?(st.ready?'Maryam is here. Ready when you are.':'Waiting for Maryam to join…'):'Waiting for Abubakar to start the game…';
    $('startBtn').classList.toggle('hide',!isA);$('startBtn').disabled=!st.ready;
    $('linkBtn').classList.toggle('hide',!isA);
  }
  if(p==='menu'){
    $('mmsg').textContent=isA?'Locked missions open when you pass the one before.':'Waiting for Abubakar to pick a mission…';
    const g=$('grid');g.textContent='';
    if(isA)st.list.forEach(x=>{
      const open=st.unlocked.includes(x.id);
      const b=el('button',(open?'':'🔒 ')+(x.id===0?'Mission 0 · Test':'Mission '+x.id)+(open?'\n'+x.title:''),open?'main':'');
      b.style.whiteSpace='pre-line';b.disabled=!open;b.onclick=()=>send({type:'pick',id:x.id});g.appendChild(b);
    });
  }
  if(p==='loading'){
    $('lnum').textContent='Mission '+m.id;$('ltitle').textContent=m.title;$('ltext').textContent='Mission '+m.id+' loading…';
    const li=$('limg');li.textContent=imgs[m.id]?'':m.icon;li.style.backgroundImage=imgs[m.id]?'url('+imgs[m.id]+')':'linear-gradient(160deg,'+m.c[0]+','+m.c[1]+')';
  }
  if(p==='play'&&m){
    $('ptitle').textContent=m.title;
    // stage
    const sk=m.id+':'+st.step+':'+st.phase+':'+imgs[m.id];
    if(sk!==stageKey){stageKey=sk;
      const sg=$('stage');sg.textContent='';const img=imgs[m.id];
      sg.style.backgroundImage=img?'url('+img+')':'linear-gradient(160deg,'+m.c[0]+','+m.c[1]+')';
      if(!img)sg.appendChild(el('div',m.icon,'ico'));
      (st.hotspots||[]).forEach(h=>{
        const b=el('button','','hs'+(img?'':' fb'));
        b.style.cssText='left:'+h.pos[0]+'%;top:'+h.pos[1]+'%;width:'+h.pos[2]+'%;height:'+h.pos[3]+'%';
        b.setAttribute('aria-label',h.label);
        if(img)b.appendChild(el('i'));else{b.appendChild(el('span',h.e));b.appendChild(el('small',h.label))}
        b.onclick=()=>showModal(h,other);sg.appendChild(b);
      });
    }
    // lock
    const L=st.lock,lk=m.id+':'+st.step+':'+(L&&L.mine)+':'+st.phase;
    if(lk!==lockKey){lockKey=lk;const box=$('lock');box.textContent='';
      if(st.phase==='play'&&L){
        box.appendChild(el('p','Step '+(st.step+1)+' of '+m.total));
        if(L.mine){
          box.appendChild(el('b','🔒 '+L.ask));
          const r=el('div','','r'),inp=el('input');inp.placeholder='Your answer';inp.autocomplete='off';
          const go=el('button','Unlock','main');
          const sub=()=>{if(inp.value.trim())send({type:'answer',text:inp.value});inp.value=''};
          go.onclick=sub;inp.onkeydown=e=>{if(e.key==='Enter')sub()};
          r.appendChild(inp);r.appendChild(go);box.appendChild(r);
        }else box.appendChild(el('b','🔒 '+L.wait+' has the lock. Tell them what you find!'));
        const mm=el('p','');mm.id='lockmsg';box.appendChild(mm);
      }
    }
    // admin controls
    const c=$('ctl');c.textContent='';
    if(isA&&st.phase==='play'){const b=el('button','Back to menu');b.onclick=()=>send({type:'back'});c.appendChild(b);
      if(TEST){const s=el('button','Skip step');s.onclick=()=>send({type:'skip'});c.appendChild(s)}}
    // chat
    const box=$('msgs');box.textContent='';
    (st.chat||[]).forEach(x=>{const q=el('p','','m');q.appendChild(el('b',x.name+': '));q.appendChild(document.createTextNode(x.text));box.appendChild(q)});
    box.scrollTop=box.scrollHeight;
  }
}
$('startBtn').onclick=()=>send({type:'start'});
$('linkBtn').onclick=async()=>{const u=location.origin+'/escape?room='+code+'&as=maryam';try{await navigator.clipboard.writeText(u);$('linkBtn').textContent='Copied!'}catch(e){prompt('Copy this link for Maryam:',u)}setTimeout(()=>$('linkBtn').textContent='Copy Maryam’s invite link',1500)};
function sendMsg(){const t=$('msg').value.trim();if(!t)return;send({type:'chat',text:t});$('msg').value=''}
$('send').onclick=sendMsg;$('msg').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
connect();
</script></body></html>
